spring:
  application:
    name: hookflow-backend
  datasource: # Spring Boot 的数据库连接配置，仍属于上方的 spring 节点。
    url: "${DB_URL}" # 从环境变量读取 JDBC 地址；不提供仓库内默认地址。
    username: "${DB_USERNAME}" # 从环境变量读取数据库用户名。
    password: "${DB_PASSWORD}" # 从环境变量读取数据库密码。

hookflow: # HookFlow 自有配置；后续步骤会实现读取和校验。
  admin: # 首次初始化管理员所需的配置。
    username: "${HOOKFLOW_ADMIN_USERNAME}" # 从环境变量读取初始管理员用户名。
    password: "${HOOKFLOW_ADMIN_PASSWORD}" # 从环境变量读取初始管理员密码。
  security: # 应用敏感配置。
    secret-encryption-key: "${HOOKFLOW_SECRET_ENCRYPTION_KEY}" # 从环境变量读取加密主密钥。
  redis: # 可选的任务唤醒配置；Redis 不是任务事实来源。
    host: "${REDIS_HOST:localhost}" # 未设置时采用本机地址；目前尚未连接 Redis。
    port: "${REDIS_PORT:6379}" # 未设置时采用默认端口；目前尚未连接 Redis。
  delivery: # 新建投递任务时要使用的策略配置。
    max-attempts: "${HOOKFLOW_MAX_ATTEMPTS:3}" # 未设置时每轮最多尝试 3 次。
    retry-delays: "${HOOKFLOW_RETRY_DELAYS:10s,30s}" # 未设置时采用两档 10 秒、30 秒间隔。

management: # 配置 Actuator 管理功能。
  endpoints: # 配置管理端点的暴露范围。
    web: # 以下规则只针对 HTTP 访问。
      exposure: # 指定允许通过 HTTP 访问的端点。
        include: health # 仅暴露健康检查，不暴露其他管理端点。
  endpoint: # 配置单个管理端点的响应。
    health: # 以下设置只作用于健康检查。
      probes: # 配置存活和就绪探针分组。
        enabled: false # 当前阶段不暴露这两个额外的健康检查分组。
      show-details: never # 不返回内部健康检查的详细信息。
      show-components: never # 不列出数据库等内部组件。

logging: # 配置应用日志输出。
  structured: # 使用 Spring Boot 内置的结构化日志功能。
    format: # 指定日志的输出格式。
      console: logstash # 控制台每条日志输出为 JSON；MDC 中的 requestId 会成为 JSON 字段。